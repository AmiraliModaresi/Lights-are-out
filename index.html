<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Reveal</title>
    <link rel="stylesheet" href="style.css">

    <!-- google fonts connection -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="reveal-world" id="scene">
        <div class="hint">
            <p>Move your mouse around!</p>
        </div>
        <div class="center">
            <div class="text-container">
                <h1 class="text">AMIR ALI</h1>
                <h1 class="text-border">AMIR ALI</h1>
                <img src="images/crown.png" alt="" class="crown-img">
            </div>
            <div class="text-container">
                <h1 class="text">MODARESI</h1>
                <h1 class="text-border">MODARESI</h1>
            </div>

            <img src="images/wings.png" alt="" class="wings-img">
            <div class="spider-web"></div>
            <img src="images/spider.png" alt="" class="spider-img">
            <img src="images/coin.png" alt="" class="coin-img">
            <div class="music-img">
                <img src="images/note.png" alt="" class="music1-img">
                <img src="images/note2.png" alt="" class="music2-img">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
